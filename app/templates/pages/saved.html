{% extends "layouts/base.html" %}

{% block title %}
Saved Places | Yatrik
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="fw-bold mb-0">Bookmark Places</h1>
        <button class="btn btn-outline-primary shadow-sm" onclick="shareList()">
            <i class="bi bi-share"></i> Share List
        </button>
    </div>

    <div class="row g-4" id="saved-container">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-muted">Loading your saved places...</p>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    loadSavedPlaces();
});

function loadSavedPlaces() {
    const container = document.getElementById("saved-container");
    fetch("/api/saved")
        .then(res => res.json())
        .then(data => {
            container.innerHTML = "";
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-bookmark text-muted" style="font-size: 3rem;"></i>
                        <h3 class="mt-3">No Saved Places</h3>
                        <p class="text-muted">You haven't saved any places yet. Start exploring and save places you want to visit.</p>
                        <a href="/temples" class="btn btn-primary mt-3">Explore Temples</a>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const card = document.createElement("div");
                card.className = "col-12 col-md-6 col-lg-4";
                const icon = item.type === 'temple' ? '🛕' : '📍';
                
                card.innerHTML = `
                    <div class="card shadow-sm h-100 border-0">
                        <img src="/static/images/${item.image}" class="card-img-top" style="height:200px; object-fit:cover;" alt="${item.name}">
                        <div class="card-body d-flex flex-column">
                            <h3 class="h5 fw-bold mb-1">${icon} ${item.name}</h3>
                            <p class="text-muted small mb-3">📍 ${item.city}</p>
                            <div class="mt-auto d-flex gap-2">
                                <a href="${item.url}" class="btn btn-success flex-grow-1">View Details</a>
                                <button class="btn btn-outline-danger" onclick="removeSaved(${item.id}, '${item.type}', this)" title="Remove">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        })
        .catch(err => {
            console.error("Error loading saved places:", err);
            container.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error loading saved places.</div></div>`;
        });
}

function removeSaved(id, type, btnElement) {
    fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, type: type })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "removed") {
            const col = btnElement.closest('.col-12');
            col.remove();
            
            // Check if empty
            const container = document.getElementById("saved-container");
            if (container.children.length === 0) {
                loadSavedPlaces(); // Will render empty state
            }
        }
    })
    .catch(console.error);
}

function shareList() {
    alert("Share list functionality coming soon!");
}
</script>
{% endblock %}
