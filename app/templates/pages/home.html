{% extends "layouts/base.html" %}

{% block title %}
Yatrik | Home
{% endblock %}


{% block content %}


<!-- Hero Section -->

<section class="hero">

    <div class="container">

        <h1 class="display-3 fw-bold">
            Discover the Divine Heart of Braj
        </h1>


        <p class="lead mt-3">
            AI Powered Pilgrimage Platform
        </p>



        <div class="search-box mt-5">

            <input
                id="searchInput"
                class="form-control form-control-lg"
                type="text"
                placeholder="Search Temples...">


            <div id="search-results" class="mt-3"></div>


        </div>


    </div>

</section>





<!-- Popular Temples -->

<section class="py-5">

<div class="container">


<div class="text-center mb-5">

<h2 class="fw-bold">
Popular Temples
</h2>


<p class="text-muted">
Explore the most visited temples in Braj.
</p>


</div>




<div class="row g-4" id="temple-container">

</div>



</div>

</section>






<script>


const container = document.getElementById("temple-container");

const searchInput = document.getElementById("searchInput");

const resultBox = document.getElementById("search-results");





function loadTemples(url="/api/temples"){


fetch(url)

.then(response => response.json())


.then(temples => {


container.innerHTML = "";


temples.forEach(temple => {



container.innerHTML += `


<div class="col-md-6 col-lg-3">


<div class="card h-100 shadow border-0">



<img src="/static/images/${temple.image}"

class="card-img-top"

style="height:250px;object-fit:cover;">



<div class="card-body">



<h4>
${temple.name}
</h4>



<p class="text-muted">
${temple.description}
</p>



<p>
📍 ${temple.city}
</p>



<p>
⏰ ${temple.opening_time}
-
${temple.closing_time}
</p>



<a href="/temples/${temple.id}"

class="btn btn-warning w-100">

View Details

</a>



</div>


</div>


</div>



`;



});


});


}






// Load all temples initially

loadTemples();







// Search System


searchInput.addEventListener("keyup", function(){


let query = this.value.trim();



if(query.length === 0){


resultBox.innerHTML = "";

loadTemples();

return;


}





fetch("/api/temples/search?q=" + query)


.then(response => response.json())


.then(temples => {



resultBox.innerHTML = "";



temples.forEach(temple => {



resultBox.innerHTML += `



<div class="card shadow p-3 mb-3">



<h5>
🛕 ${temple.name}
</h5>



<p>
📍 ${temple.city}
</p>



<a href="/temples/${temple.id}"

class="btn btn-warning">

View Details

</a>



</div>



`;



});


});



});




</script>



{% endblock %}
