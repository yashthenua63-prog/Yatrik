{% extends "layouts/base.html" %}

{% block title %}Become a Driver - Yatrik Partner{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 mt-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="fw-bold mb-4">Become a Yatrik Driver</h2>
                    <form method="POST" action="{{ url_for('partner.onboard_driver') }}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Vehicle Type</label>
                            <select class="form-select" name="vehicle_type" required>
                                <option value="E-Rickshaw">E-Rickshaw</option>
                                <option value="Auto">Auto Rickshaw</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Vehicle Registration Number</label>
                            <input type="text" class="form-control" name="vehicle_number" placeholder="e.g. UP 85 AA 1234" required>
                        </div>
                        
                        <div class="alert alert-info border-info mb-4">
                            <strong><i class="bi bi-shield-lock"></i> Secure Upload</strong><br>
                            Your ID Proof/Driving License will be encrypted and stored securely. It will never be shown to the public.
                            <div class="mt-3">
                                <label class="form-label fw-bold">Upload ID Proof / License</label>
                                <input type="file" class="form-control" name="license_document" accept="image/*,.pdf" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Submit Registration</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
