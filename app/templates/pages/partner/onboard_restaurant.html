{% extends "layouts/base.html" %}

{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <h1 class="mb-2">List Your Restaurant</h1>
                <p class="text-muted">Showcase your pure veg menu to pilgrims traveling across Braj.</p>
            </div>

            <div class="yatrik-card p-4">
                <form method="POST" action="/partner/restaurant/add">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Restaurant Name *</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">City *</label>
                            <select class="form-select" name="city" required>
                                <option value="" disabled selected>Select City</option>
                                <option value="Vrindavan">Vrindavan</option>
                                <option value="Mathura">Mathura</option>
                                <option value="Govardhan">Govardhan</option>
                                <option value="Barsana">Barsana</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address *</label>
                            <input type="text" class="form-control" name="address" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" name="phone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cuisine (e.g., Pure Veg, North Indian)</label>
                            <input type="text" class="form-control" name="cuisine" placeholder="Pure Veg, Satvik">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Timings</label>
                            <input type="text" class="form-control" name="timings" placeholder="8:00 AM - 10:00 PM">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Price Range</label>
                            <select class="form-select" name="price_range">
                                <option value="₹">₹ (Budget)</option>
                                <option value="₹₹">₹₹ (Mid-range)</option>
                                <option value="₹₹₹">₹₹₹ (Premium)</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Website (Optional)</label>
                            <input type="url" class="form-control" name="website" placeholder="https://...">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="4"></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-orange w-100 py-2">Submit for Verification</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
