<div class="card h-100 border-0 shadow-sm yatrik-card" style="border-radius: var(--radius);">
    <img
        src="/static/images/{{ temple.image }}"
        class="card-img-top {{ image_class|default('temple-card-image') }}"
        alt="{{ temple.name }} Vrindavan"
        loading="lazy"
        onerror="this.onerror=null;this.src='/static/images/default_temple.jpg';"
        style="height: 200px; object-fit: cover; border-top-left-radius: var(--radius); border-top-right-radius: var(--radius);"
    >
    <div class="card-body d-flex flex-column p-4">
        <h3 class="h5 fw-bold" style="color: var(--maroon);">
            🛕 {{ temple.name }}
        </h3>
        <p class="mb-2 fw-semibold" style="color: var(--text-primary);">
            <i class="bi bi-geo-alt" style="color: var(--saffron);"></i> {{ temple.city }}
        </p>
        {% if show_distance and temple.distance %}
        <p class="text-muted small">
            📏 {{ temple.distance }} km away
        </p>
        {% endif %}
        <p class="card-text text-muted small">
            {% if temple.description %}
            {{ temple.description[:100] }}...
            {% else %}
            Explore this sacred place in Vrindavan.
            {% endif %}
        </p>
        <a href="/temples/{{ temple.id }}" class="btn btn-outline-dark rounded-pill fw-bold mt-auto w-100">
            View Details
        </a>
    </div>
</div>
