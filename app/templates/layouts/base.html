<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Search Console Verification -->
    <meta
        name="google-site-verification"
        content="cJWpO7ArrScS2sm-aIfj1vRL_FmMa5JQifHZxLUI75k"
    >

    <!-- SEO Description -->
    <meta
        name="description"
        content="{% block meta_description %}Yatrik is an AI-powered pilgrimage platform to discover temples, darshan timings and sacred places across Braj and Vrindavan.{% endblock %}"
    >

    <!-- SEO Keywords -->
    <meta
        name="keywords"
        content="Yatrik Vrindavan, Vrindavan temples, Braj temples, Prem Mandir, Banke Bihari Temple, ISKCON Vrindavan, Radha Raman Temple, Nidhivan"
    >

    <meta name="author" content="Yatrik">

    <!-- Page Title -->
    <title>
        {% block title %}
        Yatrik Vrindavan – Temple Guide, Darshan & Timings
        {% endblock %}
    </title>

    <!-- Canonical URL -->
    <link
        rel="canonical"
        href="{% block canonical_url %}https://yatrik-rw1u.onrender.com/{% endblock %}"
    >

    <!-- Open Graph -->
    <meta
        property="og:title"
        content="{% block og_title %}Yatrik Vrindavan – Temple Guide, Darshan & Timings{% endblock %}"
    >

    <meta
        property="og:description"
        content="{% block og_description %}Explore Vrindavan temples, darshan timings and pilgrimage information with Yatrik.{% endblock %}"
    >

    <meta
        property="og:url"
        content="{% block og_url %}https://yatrik-rw1u.onrender.com/{% endblock %}"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Yatrik"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block head %}
    {% endblock %}

</head>


<body>

    <!-- Navbar -->
    {% include 'components/navbar.html' %}


    <!-- Main Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    {% include 'components/footer.html' %}


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JS -->
    <script
        src="{{ url_for('static', filename='js/main.js') }}">
    </script>


    {% block scripts %}
    {% endblock %}

</body>

</html>
